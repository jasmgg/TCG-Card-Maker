directories:
  output: dist
  buildResources: build
appId: com.tcgcardmaker.app
productName: TCG Card Maker
win:
  target:
    - nsis
    - portable
  icon: assets/icon.png
nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
portable:
  artifactName: TCG-Card-Maker-Portable.exe
mac:
  target: dmg
linux:
  target: AppImage
files:
  - filter:
      - src/**/*
      - assets/**/*
      - node_modules/**/*
electronVersion: 28.3.3
